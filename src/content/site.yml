      title: { en: "Beyond the stack",    es: "Más allá del código"      }
      copy:
        en: "I'm an IT Architect who photographs and makes music. The work crosses over more than people expect. My technical decisions carry artistic references. My photos carry engineering logic. I don't separate the two — I never have."
        es: "Soy un Arquitecto TI que fotografía y hace música. El trabajo se cruza más de lo que la gente espera. Mis decisiones técnicas llevan referencias artísticas. Mis fotos llevan lógica de ingeniería. No los separo — nunca lo he hecho."
