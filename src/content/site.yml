      illustration: { en: Illustration, es: Ilustración }
      music:        { en: Music,        es: Música      }
    technical:
      title:    { en: "Technical Projects", es: "Proyectos técnicos"    }
      gh_label: { en: "View all on GitHub →", es: "Ver todo en GitHub →" }
      featured_label: { en: Featured,   es: Destacado                   }
      projects:
        - name: POLQA
          href: https://polqa-framework.github.io/polqa-site/
          featured: true
          tags: [Python, LLM Governance, Adversarial Testing, OpenAI]
          tagline:
            en: LLM Output Governance & Bias Evaluation Framework
            es: Gobernanza de Output LLM y Evaluación de Sesgos
          description:
            en: A modular CLI framework for governing LLM output quality at scale. Provider-agnostic, reproducible, and built for auditability across model versions. Supports HuggingFace, Ollama, OpenAI, Claude, and custom endpoints.
            es: Framework CLI modular para gobernar la calidad de output de LLMs a escala. Agnóstico de proveedor, reproducible y construido para auditabilidad entre versiones de modelos. Soporta HuggingFace, Ollama, OpenAI, Claude y endpoints personalizados.
        - name: Automation Learn
          href: https://github.com/leonardespi/automation-learn
          featured: false
          tags: [Selenium, Cypress, Robot Framework, CI/CD]
          tagline:
            en: "Scalable QA Capability — From Manual to Automated"
            es: "Capacidad QA Escalable — De Manual a Automatizado"
          description:
            en: Opinionated learning paths designed to institutionalize quality knowledge rather than keep it person-dependent. Covers Selenium, Cypress, API testing, CI/CD, and test architecture.
            es: Rutas de aprendizaje diseñadas para institucionalizar el conocimiento de calidad en lugar de mantenerlo dependiente de personas. Cubre Selenium, Cypress, pruebas de API, CI/CD y arquitectura de pruebas.
        - name: SynLeo
          href: https://github.com/leonardespi/synleo
          featured: false
          tags: [Python, Generative AI, System Design, Creative Tech]
          tagline:
            en: Generative AI Architecture for Creative Systems
            es: Arquitectura de IA Generativa para Sistemas Creativos
          description:
            en: An architectural exploration of generative AI applied to music production. Voice modeling, lyric generation, and governance challenges unique to AI-generated creative content.
            es: Una exploración arquitectónica de la IA generativa aplicada a la producción musical. Modelado de voz, generación de letras y desafíos de gobernanza únicos al contenido creativo generado por IA.
        - name: Resume Builder
          href: https://github.com/leonardespi/resume-builder
          featured: false
          tags: [Python, PDF Generation, CLI, YAML]
          tagline:
            en: "Structured Data → Professional Document Pipeline"
            es: "Datos Estructurados → Pipeline de Documento Profesional"
          description:
            en: "Separates content from presentation — YAML as source of truth, PDF as a deterministic artifact. Optimized for ATS parsing without sacrificing human readability."
            es: "Separa contenido de presentación — YAML como fuente de verdad, PDF como artefacto determinista. Optimizado para parseo ATS sin sacrificar legibilidad humana."
        - name: "SPA — System for Thought & Action"
          href: https://github.com/leonardespi/spa
          featured: false
          tags: [Obsidian, Information Architecture, GTD, Systems Design]
          tagline:
            en: Information Architecture for High-Complexity Knowledge Work
            es: Arquitectura de Información para Trabajo de Conocimiento Complejo
          description:
            en: "A personal operating system synthesizing PARA, GTD, and SCRUM into one coherent schema. Stricter structure over flexibility — consistency reduces cognitive load."
            es: "Un sistema operativo personal que sintetiza PARA, GTD y SCRUM en un esquema coherente. Estructura más estricta sobre flexibilidad — la consistencia reduce la carga cognitiva."
        - name: README Wizard
          href: https://github.com/leonardespi/readme-wizard
          featured: false
          tags: [Python, CLI, Markdown, Documentation]
          tagline:
            en: Documentation as a First-Class Engineering Artifact
            es: Documentación como Artefacto de Ingeniería de Primera Clase
          description:
            en: "Treats README generation as a structured pipeline problem. Minimal schema forces four questions every README must answer: what, install, use, contribute."
            es: "Trata la generación de READMEs como un problema de pipeline estructurado. El esquema mínimo fuerza cuatro preguntas que todo README debe responder: qué, instalar, usar, contribuir."
    creative:
