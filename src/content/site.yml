pages:

  # ── Home ────────────────────────────────────────────────────────────────────
  home:
    meta:
      description:
        en: Tech Lead owning technical risk for a LATAM payments platform, photographer, and musician based in Mexico City. Deterministic about process, spontaneous about everything else.
        es: Tech Lead a cargo del riesgo técnico de una plataforma de pagos LATAM, fotógrafo y músico en Ciudad de México. Determinista en el proceso, espontáneo en todo lo demás.

    hero:
      eyebrow:
        en: "Hey, I'm Leo"
        es: "Hola, soy Leo"
      title:
        en: "I design systems<br />that scale."
        es: "Diseño sistemas<br />que escalan."
      subtitle:
        en: Tech Lead owning technical risk for a LATAM payments platform, photographer, and musician based in Mexico City. Deterministic about process, spontaneous about everything else.
        es: Tech Lead a cargo del riesgo técnico de una plataforma de pagos LATAM, fotógrafo y músico en Ciudad de México. Determinista en el proceso, espontáneo en todo lo demás.
      trajectory:
        en: 'Tech Lead, Technical Risk at <a href="{{work_href}}" target="_blank" rel="noopener noreferrer" class="clip-link">Clip</a>'
        es: 'Tech Lead, Riesgo Técnico en <a href="{{work_href}}" target="_blank" rel="noopener noreferrer" class="clip-link">Clip</a>'
      ctas:
        - label: { en: Read the Blog,  es: Leer el Blog    }
          href: /writing
          variant: primary
        - label: { en: See Projects,   es: Ver Proyectos   }
          href: /work
          variant: ghost

    available_for:
      label: { en: "Available for",  es: "Disponible para" }
      cta:   { en: "Get in touch",   es: "Hablemos"        }
      items:
        - text: { en: "Technical risk & reliability consulting",             es: "Consultoría de riesgo técnico y confiabilidad" }
          detail: { en: "(distributed systems, fintech, payments)",           es: "(sistemas distribuidos, fintech, pagos)" }
        - text: { en: "Photography · Digital illustration · Music",        es: "Fotografía · Ilustración digital · Música" }
          detail: { en: "(CDMX · monthly retainers available)",               es: "(CDMX · disponible en modelo de suscripción)" }
        - text: { en: "Technical writing & documentation",                  es: "Redacción técnica y documentación" }
        - text: { en: "Open source collaboration",                          es: "Colaboración open source" }

    writing:
      title: { en: Recent Writing,        es: Lo más reciente            }
      all:   { en: "All posts →",         es: "Todos los artículos →"   }

    dual_identity:
      title: { en: "Beyond the stack",    es: "Más allá del código"      }
      copy:
        en: "I'm a Tech Lead who owns technical risk for a payments platform, and I photograph and make music. The work crosses over more than people expect. My technical decisions carry artistic references. My photos carry engineering logic. I don't separate the two — I never have."
        es: "Soy Tech Lead a cargo del riesgo técnico de una plataforma de pagos, y también fotografío y hago música. El trabajo se cruza más de lo que la gente espera. Mis decisiones técnicas llevan referencias artísticas. Mis fotos llevan lógica de ingeniería. No los separo — nunca lo he hecho."
      link:   { en: "See all work →",     es: "Ver todo →"               }
      samples:
        - key: photo
          type: image
          src: https://res.cloudinary.com/dgzxjdbhg/image/upload/q_auto,f_auto,w_600/v1778816066/IMG_0785_hj90jj.jpg
          label: { en: Photography,       es: Fotografía                 }
        - key: illustration
          type: image
          src: https://res.cloudinary.com/dgzxjdbhg/image/upload/v1778853292/epicCastle_sase4s.png
          label: { en: Illustration,      es: Ilustración                }
        - key: music
          type: youtube
          src: https://www.youtube.com/embed/NkwqY4zhh8E
          label: { en: Music,             es: Música                     }

    cta:
      title:
        en: "Reliability, technical risk, and the space between."
        es: "Confiabilidad, riesgo técnico y lo que pasa entre ambas."
      body:
        en: "If you're looking for someone who can own technical risk, evaluate trade-offs rigorously, and align engineering decisions with business outcomes — let's talk."
        es: "Si buscas a alguien que asuma el riesgo técnico, evalúe trade-offs con rigor y conecte las decisiones técnicas con resultados de negocio — hablemos."
      resume:  { en: "View Resume",       es: "Ver Currículum"           }
      contact: { en: "Get in Touch",      es: "Contactar"                }

  # ── Services ─────────────────────────────────────────────────────────────────
  services:
    meta:
      title:       { en: Services,       es: Servicios                  }
      description:
        en: "Technical risk consulting and creative services by Leonardo Espinosa — distributed systems, fintech, payments, photography, illustration, and music production."
        es: "Consultoría de riesgo técnico y servicios creativos de Leonardo Espinosa — sistemas distribuidos, fintech, pagos, fotografía, ilustración y producción musical."
    header:
      eyebrow: { en: "What I offer",      es: "Lo que ofrezco"           }
      title:   { en: Services,            es: Servicios                  }
      subtitle:
        en: "Two disciplines, one way of thinking. Available for project-based, retainer, or one-time engagements."
        es: "Dos disciplinas, una sola forma de pensar. Disponible por proyecto, retainer o sesiones puntuales."

    technical:
      tag:   { en: Technical,             es: Técnico                    }
      title: { en: "Technical Risk & Reliability Consulting", es: "Consultoría de Riesgo Técnico y Confiabilidad" }
      intro:
        en: "I design and review the systems that move money, govern AI output, and hold under load. Engagements are trade-off-driven — I tell you what breaks before it does."
        es: "Diseño y reviso los sistemas que mueven dinero, gobiernan outputs de IA y aguantan carga real. Cada proyecto arranca por los trade-offs: te digo qué se va a romper antes de que pase."
      services:
        - name: { en: "Distributed Systems Design & Review",           es: "Diseño y revisión de sistemas distribuidos"               }
          desc: { en: "Architecture reviews, failure mode analysis, and greenfield design for distributed systems. Fintech and payments infrastructure experience at scale.", es: "Revisiones de arquitectura, análisis de modos de fallo y diseño desde cero. Experiencia operando a escala en infraestructura fintech y de pagos." }
        - name: { en: "Cloud Architecture",                            es: "Arquitectura cloud"                                       }
          desc: { en: "Azure · GCP. Landing zone design, cost governance, migration planning, and multi-cloud strategy. No vendor lock-in advocacy — only what the system actually needs.", es: "Azure y GCP. Diseño de landing zones, gobernanza de costos, planes de migración y estrategia multi-cloud. Sin promover vendor lock-in — solo lo que el sistema realmente necesita." }
        - name: { en: "CI/CD Governance & Quality Engineering",        es: "Gobernanza CI/CD e ingeniería de calidad"                 }
          desc: { en: "Build the pipelines that make releases safe. QA automation frameworks, test architecture, and the governance layers that prevent quality from becoming a bottleneck.", es: "Construyo los pipelines que hacen los releases seguros. Frameworks de automatización QA, arquitectura de pruebas y la gobernanza necesaria para que la calidad no se vuelva el cuello de botella." }
        - name: { en: "LLM Evaluation & AI Governance",               es: "Evaluación de LLMs y gobernanza de IA"                    }
          desc: { en: "Structured evaluation frameworks for LLM output quality, bias detection, and reproducibility. Built on the same principles behind the POLQA framework.", es: "Frameworks estructurados para evaluar calidad de output, detectar sesgos y garantizar reproducibilidad. Construidos sobre los mismos principios que POLQA." }
        - name: { en: "Technical Feasibility & ROI Assessment",        es: "Factibilidad técnica y evaluación de ROI"                 }
          desc: { en: "Before you build, know the cost. I translate engineering trade-offs into language that lands in boardrooms — and back again.", es: "Antes de construir, hay que conocer el costo. Traduzco trade-offs técnicos a un lenguaje que funciona en una sala de juntas — y al revés." }
      engagement:
        title: { en: "Engagement models",      es: "Modelos de trabajo"       }
        items:
          - text:   { en: "One-time architecture review session", es: "Sesión puntual de revisión de arquitectura" }
            detail: { en: "(2h)",                                 es: "(2h)"                                       }
          - text:   { en: "Project-based consulting",             es: "Consultoría por proyecto"                  }
          - text:   { en: "Ongoing advisory retainer",            es: "Asesoría continua en retainer"             }
            detail: { en: "(monthly)",                            es: "(mensual)"                                  }
      cta: { en: "Contact for pricing and availability", es: "Contactar para disponibilidad y precios" }

    creative:
      tag:   { en: Creative,              es: Creativo                   }
      title: { en: "Creative Services",   es: "Servicios creativos"      }
      intro:
        en: "The same systematic thinking behind distributed systems applies here. Available in Mexico City and remotely for digital deliverables."
        es: "El mismo pensamiento sistemático que aplico a los sistemas distribuidos vive aquí. Disponible en Ciudad de México y de forma remota para entregables digitales."
      disciplines:
        - name: { en: Photography,         es: Fotografía               }
          items:
            - { en: "Commercial & product shoots",           es: "Sesiones comerciales y de producto"       }
            - { en: "Portrait & personal branding sessions", es: "Retratos y marca personal"                }
            - { en: "Available in CDMX",                     es: "Disponible en CDMX"                      }
        - name: { en: "Digital Illustration", es: "Ilustración digital"  }
          items:
            - { en: "Brand illustration & identity",         es: "Ilustración para marca e identidad"      }
            - { en: "Editorial & conceptual illustration",   es: "Ilustración editorial y conceptual"      }
            - { en: "Icon sets & UI illustration",           es: "Sets de iconos e ilustración para UI"    }
        - name: { en: "Music Production",  es: "Producción musical"      }
          items:
            - { en: "Original compositions & jingles",       es: "Composiciones originales y jingles"      }
            - { en: "Brand audio & sonic identity",          es: "Audio de marca e identidad sonora"       }
            - text: { en: "Song production",                 es: "Producción de canciones"                 }
              detail: { en: "(full pipeline)",               es: "(pipeline completo)"                     }
      retainer:
        en: "Creative services are available as one-time projects or monthly retainers with defined deliverables per tier. Contact for current availability and pricing."
        es: "Los servicios creativos se ofrecen como proyectos únicos o como retainer mensual, con entregables definidos por nivel. Contactar para disponibilidad y precios vigentes."
      cta: { en: "Contact for pricing and availability", es: "Contactar para disponibilidad y precios" }

